<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="200" height="200" fill="none">
  <!-- Globe base (ocean) -->
  <circle cx="24" cy="28" r="17" fill="#3b82f6" />

  <!-- Landmass patches (green continents) -->
  <ellipse cx="24" cy="27" rx="8" ry="6" fill="#10b981" />
  <ellipse cx="13" cy="29" rx="4" ry="3" fill="#10b981" />
  <ellipse cx="35" cy="30" rx="3.5" ry="2.5" fill="#10b981" />
  <ellipse cx="24" cy="14" rx="5" ry="2.5" fill="#10b981" opacity="0.7" />
  <ellipse cx="24" cy="42" rx="7" ry="2" fill="#10b981" opacity="0.6" />

  <!-- Globe latitude lines -->
  <path d="M7.5 28 Q24 24 40.5 28" stroke="rgba(255,255,255,0.25)" stroke-width="0.6" fill="none" />
  <path d="M9 34 Q24 30 39 34" stroke="rgba(255,255,255,0.20)" stroke-width="0.6" fill="none" />
  <path d="M24 11 Q28 22 24 45" stroke="rgba(255,255,255,0.20)" stroke-width="0.6" fill="none" />

  <!-- Globe outline -->
  <circle cx="24" cy="28" r="17" stroke="#0ea5e9" stroke-width="1" fill="none" opacity="0.5" />

  <!-- Figure LEFT (volunteer/person) -->
  <circle cx="17" cy="10" r="2.4" fill="#1f2937" />
  <rect x="15.5" y="12.5" width="3" height="5" rx="1.5" fill="#1f2937" />
  <line x1="18.5" y1="14" x2="21" y2="13" stroke="#1f2937" stroke-width="1.4" stroke-linecap="round" />
  <line x1="16.2" y1="17.5" x2="15.5" y2="20.5" stroke="#1f2937" stroke-width="1.3" stroke-linecap="round" />
  <line x1="17.8" y1="17.5" x2="18.5" y2="20.5" stroke="#1f2937" stroke-width="1.3" stroke-linecap="round" />

  <!-- Figure RIGHT -->
  <circle cx="31" cy="10" r="2.4" fill="#1f2937" />
  <rect x="29.5" y="12.5" width="3" height="5" rx="1.5" fill="#1f2937" />
  <line x1="29.5" y1="14" x2="27" y2="13" stroke="#1f2937" stroke-width="1.4" stroke-linecap="round" />
  <line x1="30.2" y1="17.5" x2="29.5" y2="20.5" stroke="#1f2937" stroke-width="1.3" stroke-linecap="round" />
  <line x1="31.8" y1="17.5" x2="32.5" y2="20.5" stroke="#1f2937" stroke-width="1.3" stroke-linecap="round" />

  <!-- Joined hands -->
  <circle cx="24" cy="13" r="1.6" fill="#10b981" />
</svg>
